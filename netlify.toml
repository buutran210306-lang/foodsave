[build]
  publish = "."
  functions = "netlify/functions"

[[redirects]]
  from = "/api/v1/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# Tác vụ đổi nhãn/giá và thông báo, chạy mỗi 5 phút
[functions."label-automation"]
  schedule = "*/5 * * * *"

# Tác vụ đơn hàng (hạn thanh toán, vắng mặt, nhắc lấy hàng), chạy mỗi 5 phút
[functions."order-automation"]
  schedule = "*/5 * * * *"

# Service worker: luôn lấy bản mới, được phép điều khiển cả trang gốc
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
    Service-Worker-Allowed = "/"

# Manifest PWA
[[headers]]
  for = "/*.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
