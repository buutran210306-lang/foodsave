<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14613b">
<title>FoodSave</title>
<link rel="icon" href="/icons/icon-192.png">
<link rel="manifest" href="/manifest-app.webmanifest">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="FoodSave">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--g9:#0f4a2e;--g8:#14613b;--g7:#1c7c45;--g5:#22a55b;--mint:#eaf6ef;--mint2:#d9efe2;--y:#f3c94f;--ink:#111512;--mut:#6b756d;--line:#e2e9e3;--red:#dc3b2f;--redbg:#fde8e6;--ylbg:#fff4d1;--grbg:#dff3e7;--bg:#f3f8f4;--af:430px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#dfe6e0}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);max-width:var(--af);margin:0 auto;height:100vh;height:100dvh;position:relative;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.15)}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:15px;color:inherit}
i.ti{font-size:20px;line-height:1}
#view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
.scr{min-height:100%;padding-bottom:20px;animation:in .22s ease-out}
.scr.tabbed{padding-bottom:96px}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
h1{font-size:26px;font-weight:900;line-height:1.1;letter-spacing:-.01em;text-transform:uppercase}
h2{font-size:17px;font-weight:800}
.mut{color:var(--mut)}.sm{font-size:12.5px}.xs{font-size:11px}.b{font-weight:800}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.pad{padding:0 16px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 10px rgba(15,74,46,.06);border:1px solid #edf2ee}
.btn{height:50px;border-radius:15px;background:var(--g8);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-shadow:0 6px 16px rgba(20,97,59,.25)}
.btn.ghost{background:#fff;color:var(--g8);border:1.5px solid var(--g8);box-shadow:none}
.btn.red{background:var(--red);box-shadow:none}
.btn.soft{background:var(--mint2);color:var(--g8);box-shadow:none}
.btn.sm{height:38px;font-size:13px;border-radius:12px;width:auto;padding:0 14px}
.btn[disabled]{opacity:.45}
.top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;background:var(--bg);z-index:20}
.top h3{font-size:16px;font-weight:900;text-transform:uppercase;flex:1}
.ib{width:40px;height:40px;border-radius:13px;background:#fff;display:grid;place-items:center;border:1px solid var(--line);position:relative;flex:none}
.ib .dot{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;border-radius:7px;padding:3px 7px;text-transform:uppercase;letter-spacing:.02em}
.tag.green{background:var(--g7);color:#fff}.tag.yellow{background:#e0a512;color:#fff}.tag.red{background:var(--red);color:#fff}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:8px;padding:3px 8px;background:var(--grbg);color:var(--g8)}
.chip.y{background:var(--ylbg);color:#8a5a00}.chip.r{background:var(--redbg);color:#b3261e}.chip.g{background:#eef1ee;color:#586159}
.hs{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 6px;scrollbar-width:none;scroll-padding-left:16px}.hs::-webkit-scrollbar{display:none}
.pill{flex:none;padding:9px 15px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13px}
.pill.on{background:var(--g8);color:#fff;border-color:var(--g8)}
/* tab bar */
#tabs{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:none;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(8px + env(safe-area-inset-bottom));z-index:50}
#tabs.on{display:grid}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:800;color:#8b958d;padding:5px 0;text-transform:uppercase;position:relative}
#tabs button i{font-size:23px}
#tabs button.on{color:var(--g8)}
#tabs button.on:after{content:"";width:5px;height:5px;border-radius:50%;background:var(--g7);margin-top:1px}
#tabs .bd{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:9.5px;display:grid;place-items:center;padding:0 4px}
/* product row */
.prod{display:flex;gap:12px;padding:12px;background:#fff;border-radius:18px;border:1px solid #edf2ee;box-shadow:0 2px 10px rgba(15,74,46,.05);position:relative;margin-bottom:10px;cursor:pointer}
.pimg{width:84px;height:84px;border-radius:16px;display:grid;place-items:center;font-size:44px;flex:none;position:relative}
.pimg{overflow:visible}.pimg img{width:100%;height:100%;object-fit:cover;border-radius:16px;display:block}.pimg.green{background:linear-gradient(135deg,#d9f2e2,#f1fbf4)}.pimg.yellow{background:linear-gradient(135deg,#fff0bf,#fffaea)}.pimg.red{background:linear-gradient(135deg,#fbd6d2,#fff1ef)}
.pname{font-weight:800;font-size:15px;line-height:1.2}
.price{font-weight:900;font-size:17px;color:var(--red)}.price s{font-size:11.5px;font-weight:600;color:#9aa39c;margin-left:4px}
.off{background:var(--red);color:#fff;font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 6px;margin-left:6px}
.heart{position:absolute;top:10px;right:10px;font-size:19px;color:#9aa39c}.heart.on{color:var(--red)}
/* hero */
.hero{margin:6px 16px 0;border-radius:22px;background:linear-gradient(120deg,var(--g9),var(--g7));color:#fff;padding:18px;position:relative;overflow:hidden;min-height:150px}
.hero h2{font-size:23px;line-height:1.1;font-weight:900}.hero p{font-size:12.5px;opacity:.9;margin:6px 0 12px}
.hero .big{position:absolute;right:10px;bottom:0;font-size:92px;opacity:.95}
.hero .b2{background:#fff;color:var(--g8);border-radius:11px;padding:9px 14px;font-weight:800;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.lab{border-radius:18px;padding:13px;display:flex;flex-direction:column;gap:3px;text-align:left}
.lab.green{background:var(--grbg)}.lab.yellow{background:var(--ylbg)}.lab.red{background:var(--redbg)}
.lab .ic{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;margin-bottom:5px}
.lab b{font-size:13.5px}.lab small{font-size:10.5px;color:var(--mut)}.lab em{font-style:normal;font-weight:900;font-size:13px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mapbox{margin:0 16px;height:150px;border-radius:18px;background:#cfe6dc;position:relative;overflow:hidden;border:1px solid var(--line)}
.mapbox:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 48%,#fff 48% 52%,transparent 52%),linear-gradient(0deg,transparent 48%,#fff 48% 52%,transparent 52%),repeating-linear-gradient(60deg,transparent 0 40px,rgba(255,255,255,.5) 40px 43px);opacity:.9}
.pin{position:absolute;background:#fff;border-radius:99px;padding:3px 8px;font-size:11px;font-weight:800;box-shadow:0 3px 8px rgba(0,0,0,.18);display:flex;gap:3px;align-items:center;z-index:2}
.me{position:absolute;left:50%;top:55%;width:18px;height:18px;border-radius:50%;background:#2f6bf0;border:3px solid #fff;box-shadow:0 0 0 8px rgba(47,107,240,.2);z-index:2}
/* forms */
.field{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;width:100%;outline:none}
.field:focus{border-color:var(--g7)}
label.l{display:block;font-size:11px;font-weight:800;text-transform:uppercase;color:#3d4a41;margin:14px 0 6px;letter-spacing:.03em}
.steps{display:flex;gap:5px;margin-left:auto}.steps i{width:22px;height:4px;border-radius:3px;background:#cfe0d5}.steps i.on{background:var(--g8)}
.otp{display:flex;gap:8px;justify-content:space-between}.otp input{width:100%;aspect-ratio:1/1.15;text-align:center;font-size:22px;font-weight:800;border:1.5px solid var(--g5);background:var(--grbg);border-radius:12px;outline:none;min-width:0}
.sw{display:flex;background:var(--mint2);border-radius:13px;padding:4px}.sw button{flex:1;padding:10px 0;border-radius:10px;font-weight:800;font-size:13px;color:var(--mut)}.sw button.on{background:#fff;color:var(--g8);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.sopt{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;width:100%;text-align:left;font-weight:700}
.sopt .ico{width:36px;height:36px;border-radius:11px;background:var(--grbg);color:var(--g8);display:grid;place-items:center;flex:none}
/* sheet & toast */
#sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:90;display:none}
#sheetbg.on{display:block}
#sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;z-index:100;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow-y:auto}
#sheet.on{transform:none}
#sheet:before{content:"";display:block;width:38px;height:4px;border-radius:3px;background:#d5ddd6;margin:0 auto 12px}
#pushb{position:absolute;left:10px;right:10px;top:10px;z-index:300;background:linear-gradient(120deg,var(--g9),var(--g7));color:#fff;border-radius:18px;padding:12px 14px;display:flex;gap:11px;align-items:center;box-shadow:0 14px 36px rgba(0,0,0,.35);transform:translateY(-140%);transition:transform .4s cubic-bezier(.2,1.2,.4,1);cursor:pointer}#pushb.on{transform:none}#pushb .ic{width:40px;height:40px;border-radius:13px;background:#fff3;display:grid;place-items:center;flex:none}#pushb b{font-size:13.5px;display:block}#pushb span{font-size:12px;opacity:.9}#pushb em{font-style:normal;font-size:10px;opacity:.7;margin-left:auto;align-self:flex-start}
#toast{position:absolute;left:16px;right:16px;bottom:96px;background:#111512;color:#fff;padding:12px 16px;border-radius:14px;font-weight:700;font-size:13.5px;z-index:200;opacity:0;pointer-events:none;transform:translateY(10px);transition:.25s}
#toast.on{opacity:1;transform:none}
.timer{font-variant-numeric:tabular-nums;font-weight:900}
.bar{height:6px;border-radius:4px;background:#d3e6da;overflow:hidden}.bar i{display:block;height:100%;background:var(--g7);border-radius:4px}
.stepper{display:flex;align-items:flex-start;justify-content:space-between;margin:6px 0}
.stp{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9.5px;font-weight:800;color:#8b958d;text-transform:uppercase;flex:1;position:relative}
.stp b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#e4ece6;color:#9aa39c;font-size:12px;position:relative;z-index:1}
.stp.done b,.stp.cur b{background:var(--g7);color:#fff}.stp.cur b{box-shadow:0 0 0 4px rgba(34,165,91,.25)}.stp.done,.stp.cur{color:var(--g8)}
.stp:not(:last-child):after{content:"";position:absolute;top:12px;left:calc(50% + 14px);right:calc(-50% + 14px);height:2px;background:#d3e2d8}
.stp.done:not(:last-child):after{background:var(--g7)}
.qrbox{background:#fff;border:2px solid var(--g7);border-radius:22px;padding:16px;text-align:center}
.qrbox svg{width:190px;height:190px;border:1px solid var(--line);border-radius:14px;padding:8px}
.bub{max-width:78%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.35;margin-bottom:8px}
.bub.mine{background:var(--g8);color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.bub.you{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.bub small{display:block;font-size:10px;opacity:.65;margin-top:3px}
.menu{background:#fff;border-radius:18px;border:1px solid #edf2ee;overflow:hidden}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:14px;font-weight:700;font-size:14.5px;text-align:left;border-bottom:1px solid #f1f4f1}
.menu button:last-child{border:0}.menu i.ti:first-child{color:var(--g7)}.menu .chev{margin-left:auto;color:#a2aba4;font-size:17px}
.splash{background:linear-gradient(170deg,rgba(15,74,46,.55),rgba(20,97,59,.9)),url('https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=900&q=68') center/cover,var(--g9);color:#fff;min-height:100%}
.empty{text-align:center;padding:50px 24px;color:var(--mut)}.empty .e{font-size:50px}
.seg{display:flex;border-bottom:1px solid var(--line);margin:0 16px}.seg button{flex:1;padding:12px 0;font-weight:800;font-size:12.5px;color:#8b958d;text-transform:uppercase;border-bottom:3px solid transparent}.seg button.on{color:var(--g8);border-color:var(--g8)}
.acc{background:#fff;border-radius:14px;border:1px solid #edf2ee;margin-bottom:8px;overflow:hidden}.acc button{width:100%;padding:14px;text-align:left;font-weight:700;display:flex;justify-content:space-between;gap:8px}.acc div{display:none;padding:0 14px 14px;font-size:13.5px;color:#4a554d;line-height:1.5}.acc.on div{display:block}

/* ===== game cây ===== */
.garden{border-radius:24px;overflow:hidden;background:#fff;border:1px solid #edf2ee;box-shadow:0 4px 18px rgba(15,74,46,.1)}
.scene{position:relative;height:370px;background:linear-gradient(180deg,#bfe6ff 0%,#e6f7ff 55%,#dff3e7 100%);overflow:hidden}
.scene[data-stage=young],.scene[data-stage=ready]{background:linear-gradient(180deg,#a9ddff 0%,#e6f7ff 55%,#d9f2e2 100%)}
.scene svg.tree{position:absolute;left:0;right:0;bottom:66px;width:100%;height:270px;overflow:visible}
.sun{position:absolute;right:22px;top:20px;width:46px;height:46px;border-radius:50%;background:#ffe066;box-shadow:0 0 0 10px #ffe06655,0 0 0 22px #ffe06622}
.cloud{position:absolute;height:18px;width:60px;background:#fff;border-radius:99px;opacity:.9;animation:drift 22s linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:26px;height:26px;left:10px;top:-12px}.cloud:after{width:20px;height:20px;left:30px;top:-8px}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(480px)}}
.scene .sign{position:absolute;left:14px;bottom:78px;background:#8a5a2b;color:#fff;font-size:10.5px;font-weight:800;border-radius:8px;padding:5px 9px;line-height:1.2;box-shadow:0 3px 0 #5e3b19}
.scene .sign span{display:block;font-size:15px;color:#ffe9a8}
.tools{position:absolute;left:12px;top:12px;display:grid;gap:8px}
.tools button{width:50px;border-radius:14px;background:#fff;color:var(--g8);font-size:9.5px;font-weight:800;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.tools button:nth-child(2){background:linear-gradient(135deg,#ffd54a,#ff9f43);color:#7a3a00}
.boost{position:absolute;right:12px;top:84px;background:#fff;border-radius:14px;padding:6px 10px;font-size:10px;font-weight:700;color:var(--mut);box-shadow:0 3px 10px rgba(0,0,0,.1);line-height:1.2;text-align:center}
.boost b{display:block;font-size:17px;color:#e07a00}
.dock{position:absolute;left:10px;right:10px;bottom:8px;display:flex;gap:8px;align-items:center;background:#fffffff2;border-radius:18px;padding:8px;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.dock .res{display:flex;align-items:center;gap:6px;padding:0 6px;min-width:70px}
.dock .res i{color:#2a9df4;font-size:24px}.dock .res b{font-size:17px;display:block;line-height:1}.dock .res span{font-size:9.5px;color:var(--mut);font-weight:700}
.dock .wbtn{flex:1;height:44px;border-radius:13px;background:linear-gradient(135deg,#2a9df4,#1b6fd1);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.dock .wbtn[disabled]{background:#c9d3cc;color:#fff}
.dock .wbtn.alt{flex:none;background:var(--grbg);color:var(--g8);padding:0 12px;font-size:12.5px}
.drops{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
.drops i{position:absolute;top:-20px;font-style:normal;font-size:22px;opacity:0}
.scene.water .drops i{animation:fall .9s ease-in forwards}
.drops i:nth-child(1){left:44%}.drops i:nth-child(2){left:52%;animation-delay:.12s!important}.drops i:nth-child(3){left:48%;animation-delay:.25s!important}.drops i:nth-child(4){left:56%;animation-delay:.18s!important}.drops i:nth-child(5){left:40%;animation-delay:.3s!important}
@keyframes fall{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(190px)}}
.scene.water svg.tree{animation:pop .7s .55s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.scene.harvest:after{content:"🎉 🌟 🎊 ✨ 🎉";position:absolute;left:0;right:0;top:40px;text-align:center;font-size:28px;animation:conf 1.6s ease-out forwards;letter-spacing:8px}
@keyframes conf{0%{opacity:0;transform:translateY(40px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translateY(-30px) scale(1.2)}}
.can{position:absolute;left:30%;top:30px;font-size:46px;opacity:0;transform:rotate(0)}
.scene.water .can{animation:cantilt 1.1s ease-in-out}
@keyframes cantilt{0%{opacity:0;transform:translate(-30px,-10px) rotate(0)}25%{opacity:1;transform:translate(0,0) rotate(0)}55%{opacity:1;transform:translate(10px,0) rotate(-28deg)}100%{opacity:0;transform:translate(10px,0) rotate(-28deg)}}
.pill2{background:#f3f8f4;border-radius:14px;padding:10px 4px;text-align:center}.pill2 b{display:block;font-size:17px}.pill2 span{font-size:10px;color:var(--mut);font-weight:700}
.mis{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #f1f4f1}.mis:last-child{border:0}
.mis .mi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.tree-card{background:linear-gradient(120deg,#e8f8ff,var(--grbg));border-radius:18px;padding:12px;display:flex;align-items:center;gap:12px;cursor:pointer;border:1px solid #cfe8f2}
.tree-card .mini{font-size:40px;line-height:1}
/* trạng thái tải / lỗi / bài pháp lý */
@keyframes sp{to{transform:rotate(360deg)}}
.sk{background:linear-gradient(90deg,#e9efea 25%,#f5f8f5 50%,#e9efea 75%);background-size:200% 100%;animation:shim 1.2s infinite;border-radius:10px}
@keyframes shim{to{background-position:-200% 0}}
.pimg.sk{border-radius:16px}
.legalbox .legal-section{padding:6px 0!important;max-width:none!important}
.legalbox{font-size:13.5px;line-height:1.6;color:#2b362e}
.legalbox h2,.legalbox h3{margin:14px 0 6px}
.timer{font-variant-numeric:tabular-nums}
@media(min-width:500px){body{height:min(100vh,900px);margin-top:max(0px,calc((100vh - 900px)/2));border-radius:34px;border:8px solid #111512}}
.fs-pin{background:transparent;border:0}
.pinc{display:flex;align-items:center;gap:5px;background:#fff;border-radius:99px;padding:3px 9px;font-size:11px;font-weight:800;box-shadow:0 3px 8px rgba(0,0,0,.25);white-space:nowrap;width:max-content;transform:translateX(-50%);margin-left:32px}
.pinc i{width:9px;height:9px;border-radius:50%;display:block}
.mapfb{display:grid;place-items:center;height:100%;padding:16px;text-align:center;font-size:12.5px;font-weight:700;color:var(--mut)}
.mapbox .leaflet-container{width:100%;height:100%;font:inherit}
.mapbox:has(.leaflet-container):before{display:none}
</style>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
</head>
<body>
<div id="view"></div>
<nav id="tabs"></nav>
<div id="sheetbg" onclick="closeSheet()"></div>
<div id="sheet"></div>
<div id="pushb" onclick="pushGo()"></div>
<div id="toast"></div>


<script>
/* ====================================================================
   FoodSave App (người mua). Dùng chung frontend/foodsave-live-data.js (FS.sync) và foodsave-auth-client.js (FoodSaveAuth).
   Mọi dữ liệu và luật nghiệp vụ lấy từ API; client chỉ hiển thị.
   Các mảng toàn cục dưới đây do foodsave-live-data.js tự điền (replaceArray) sau mỗi lần tải/làm mới.
   ==================================================================== */
const PRODUCTS = [], STORES = [], VOUCHERS = [], ORD = [], NOTIFS = [], COMPLAINTS = [];

/* ---------- tiện ích ---------- */
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const q1 = s => esc(String(s == null ? '' : s).replace(/[^\w\-]/g, ''));      // dùng trong onclick="f('...')" (id/mã chỉ gồm chữ, số, - _)
const fmt = n => (Number(n) || 0).toLocaleString('vi-VN') + 'đ';
const now = () => Date.now(), MIN = 60000;
const tms = v => { const t = v ? new Date(v).getTime() : 0; return Number.isFinite(t) ? t : 0; };
const hhmm = v => v ? new Date(v).toLocaleTimeString('vi-VN', { hour: '2-digit', minute: '2-digit' }) : '';
const dmy = v => v ? new Date(v).toLocaleDateString('vi-VN') : '';
const dmyhm = v => v ? new Date(v).toLocaleString('vi-VN', { hour: '2-digit', minute: '2-digit', day: '2-digit', month: '2-digit' }) : '';
const noAccent = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').toLowerCase();
const left = h => h < 1 ? Math.max(1, Math.round(h * 60)) + ' phút' : h < 24 ? h.toFixed(1).replace('.0', '') + ' giờ' : Math.round(h / 24) + ' ngày';
const errMsg = e => {
  if (!e) return 'Có lỗi xảy ra, vui lòng thử lại';
  if (e instanceof TypeError || /failed to fetch|networkerror|load failed/i.test(e.message || '')) return 'Mất kết nối mạng. Kiểm tra mạng rồi thử lại.';
  return e.message || 'Có lỗi xảy ra, vui lòng thử lại';
};
const API = (path, opt) => (window.FS && FS.sync) ? FS.sync.request(path, opt) : Promise.reject(new Error('Chưa kết nối được máy chủ'));

/* Nhãn: màu, tên. Số phút/điểm KHÔNG ghi cứng: lấy từ GET /catalog/policy (S.policy) */
const LAB = {
  green: { n: 'Xanh', sub: 'Tươi mới · >5 ngày', ic: 'ti-circle-check' },
  yellow: { n: 'Vàng', sub: 'Cận date · 3-5 ngày', ic: 'ti-clock' },
  red: { n: 'Đỏ', sub: 'Cứu trợ khẩn cấp · <24h', ic: 'ti-alert-triangle' }
};
/* Emoji CHỈ là ảnh dự phòng theo danh mục khi cửa hàng chưa tải ảnh hoặc ảnh lỗi */
const CAT_EM = { meal: '🍱', bakery: '🥖', dairy: '🥛', fruit: '🍎', sweet: '🍰', drink: '☕', veggie: '🥬', meat: '🥩', other: '🍽️' };
const catEm = p => CAT_EM[p && p.cat] || '🍽️';

/* ---------- trạng thái ---------- */
const S = {
  user: null, trust: null, policy: null, cart: [], stack: [], tab: 'home', filt: {}, fav: new Set(),
  loaded: false, netErr: '', raw: {}, chat: {}, pm: 'momo', voucher: null, otp: {}, busy: false,
  loc: null, authChecked: false
};
const CART_KEY = 'foodsave.app.cart.v1';
try { const c = JSON.parse(localStorage.getItem(CART_KEY) || '[]'); if (Array.isArray(c)) S.cart = c.filter(x => x && x.p && x.q > 0); } catch (e) { /* bỏ qua */ }
const saveCart = () => { try { localStorage.setItem(CART_KEY, JSON.stringify(S.cart)); } catch (e) { /* bỏ qua */ } };

const buyable = () => PRODUCTS.filter(p => !p.donation);
const prod = id => PRODUCTS.find(x => x.id === id);
const store = id => STORES.find(x => x.id === id);
const orderOf = id => ORD.find(x => x.id === id);
const pct = p => p.original > p.price && p.original > 0 ? Math.round((1 - p.price / p.original) * 100) : 0;

/* Ảnh thật từ Storage (image_url/image_urls); lỗi/thiếu thì emoji theo danh mục */
function pic(p, fs) {
  const em = catEm(p), size = fs || 44;
  const url = p && (p.image || (p.images && p.images[0]));
  if (!url) return `<span style="font-size:${size}px">${em}</span>`;
  return `<img src="${esc(url)}" alt="${esc(p.name)}" loading="lazy" decoding="async" onerror="this.outerHTML='<span style=&quot;font-size:${size}px&quot;>${em}</span>'">`;
}
function storeAv(s, size) {
  const px = size || 30;
  if (s && s.logoUrl) return `<img src="${esc(s.logoUrl)}" alt="" loading="lazy" style="width:${px + 12}px;height:${px + 12}px;border-radius:12px;object-fit:cover" onerror="this.outerHTML='<span style=&quot;font-size:${px}px&quot;>${esc((s && s.logo) || '🏪')}</span>'">`;
  return `<span style="font-size:${px}px">${esc((s && s.logo) || '🏪')}</span>`;
}

/* ---------- router ---------- */
const V = document.getElementById('view'), T = document.getElementById('tabs');
const TABS = [['home', 'ti-home-2', 'Khám phá'], ['search', 'ti-search', 'Tìm kiếm'], ['fav', 'ti-heart', 'Yêu thích'], ['orders', 'ti-receipt-2', 'Đơn hàng'], ['me', 'ti-user', 'Cá nhân']];
const timers = {};
function clearTimers() { Object.keys(timers).forEach(k => { clearInterval(timers[k]); delete timers[k]; }); }
function go(name, arg) { S.stack.push([name, arg]); draw(); }
function back() { S.stack.pop(); if (!S.stack.length) S.stack.push(['tab', S.tab]); draw(); }
function tab(t) { S.tab = t; S.stack = [['tab', t]]; draw(); }
function root(name, arg) { S.stack = [[name, arg]]; draw(); }
const curScreen = () => (S.stack[S.stack.length - 1] || ['welcome'])[0];
function draw() {
  clearTimers();
  const [n, a] = S.stack[S.stack.length - 1] || ['welcome'];
  const f = n === 'tab' ? TABV[a] : SCR[n];
  if (!f) { root('welcome'); return; }
  V.innerHTML = f(a); V.scrollTop = 0;
  const showTabs = n === 'tab';
  T.className = showTabs ? 'on' : '';
  if (showTabs) {
    const act = ORD.filter(isActive).length;
    T.innerHTML = TABS.map(x => `<button class="${x[0] === a ? 'on' : ''}" onclick="tab('${x[0]}')"><i class="ti ${x[1]}"></i>${x[2]}${x[0] === 'orders' && act ? `<span class="bd">${act}</span>` : ''}</button>`).join('');
  }
  const sc = V.firstElementChild; if (sc && showTabs) sc.classList.add('tabbed');
  tick();
  const h = SCRH[n]; if (h) h(a);
}
/* làm mới nhẹ khi dữ liệu nền cập nhật: không vẽ lại khi đang gõ hoặc đang mở bảng */
const SOFT = new Set(['tab', 'list', 'detail', 'store', 'order', 'notifs', 'map', 'cart', 'vouchers', 'wallet', 'rep', 'impact']);
function softRefresh() {
  const ae = document.activeElement;
  if (ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName)) return;
  if (document.getElementById('sheet').classList.contains('on')) return;
  const n = curScreen(); if (!SOFT.has(n)) return;
  if (n === 'tab' && S.tab === 'search') return;
  const y = V.scrollTop; draw(); V.scrollTop = y;
}
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.className = 'on'; clearTimeout(toast.t); toast.t = setTimeout(() => t.className = '', 2600); }
function sheet(h) { const s = document.getElementById('sheet'); s.innerHTML = h; s.classList.add('on'); document.getElementById('sheetbg').classList.add('on'); }
function closeSheet() { document.getElementById('sheet').classList.remove('on'); document.getElementById('sheetbg').classList.remove('on'); }
let _pg = null;
function push(ic, t, d, g) { const e = document.getElementById('pushb'); e.innerHTML = `<div class="ic"><i class="ti ${esc(ic)}" style="font-size:22px"></i></div><div><b>${esc(t)}</b><span>${esc(d)}</span></div><em>Bây giờ</em>`; _pg = g || null; e.classList.add('on'); clearTimeout(push.t); push.t = setTimeout(() => e.classList.remove('on'), 5200); }
function pushGo() { document.getElementById('pushb').classList.remove('on'); if (_pg) { const g = _pg; _pg = null; go(g[0], g[1]); } }
const topbar = (t, right = '') => `<div class="top"><button class="ib" onclick="back()"><i class="ti ti-arrow-left"></i></button><h3>${t}</h3>${right}</div>`;
const cartN = () => S.cart.reduce((a, c) => a + c.q, 0);
const unread = () => NOTIFS.filter(n => n.unread).length;

/* skeleton / rỗng / lỗi (có nút thử lại) */
const skel = (n = 4) => `<div class="pad">${Array.from({ length: n }, () => '<div class="prod"><div class="pimg sk"></div><div class="grow"><div class="sk" style="height:12px;width:60%"></div><div class="sk" style="height:16px;width:85%;margin-top:8px"></div><div class="sk" style="height:12px;width:40%;margin-top:10px"></div></div></div>').join('')}</div>`;
const errBox = (m, fn) => `<div class="empty"><div class="e">📡</div><b>${esc(m)}</b><br><button class="btn sm mt16" style="margin:16px auto 0" onclick="${fn || 'reloadAll()'}"><i class="ti ti-refresh"></i>Thử lại</button></div>`;
const emptyBox = (e, t, s = '') => `<div class="empty"><div class="e">${e}</div><b>${t}</b>${s ? `<br><span class="sm">${s}</span>` : ''}</div>`;
const listOrState = (arr, render, emptyHtml) => {
  if (!S.loaded) return skel();
  if (S.netErr && !PRODUCTS.length) return errBox(S.netErr);
  return arr.length ? arr.map(render).join('') : emptyHtml;
};

/* đồng hồ đếm ngược: mốc thời gian lấy từ server (data-cd = mili giây tuyệt đối) */
function fmtT(ms) { ms = Math.max(0, ms); const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), ss = s % 60; return (h ? h + ':' : '') + String(m).padStart(2, '0') + ':' + String(ss).padStart(2, '0'); }
const cdSpan = (iso, extra = '') => `<span class="timer" data-cd="${tms(iso)}" ${extra}></span>`;
function tick() {
  document.querySelectorAll('[data-cd]').forEach(e => {
    const t = +e.dataset.cd - now(); e.textContent = t <= 0 ? 'Hết hạn' : fmtT(t);
    if (e.dataset.bar) { const tot = +e.dataset.tot, el = document.getElementById(e.dataset.bar); if (el && tot) el.style.width = Math.max(0, Math.min(100, t / tot * 100)) + '%'; }
  });
}
setInterval(tick, 1000);

/* ---------- vòng đời dữ liệu (foodsave-live-data.js gọi các hàm này sau khi thay mảng) ---------- */
window.foodsaveAfterProductsReplace = function () {
  S.loaded = true;
  if (PRODUCTS.length) S.netErr = '';
  else probeNet();
  softRefresh();
};
window.foodsaveAfterOrdersReplace = function () { S.authedData = true; softRefresh(); };
window.foodsaveAfterNotifsReplace = function () { onNotifs(); softRefresh(); };
let _probing = false;
function probeNet() {   // Danh sách rỗng: do chưa có hàng hay do lỗi mạng? Hỏi nhanh để phân biệt.
  if (_probing) return; _probing = true;
  API('/catalog/products?limit=1').then(() => { S.netErr = ''; }).catch(e => { S.netErr = errMsg(e); })
    .then(() => { _probing = false; softRefresh(); });
}
function reloadAll() { S.loaded = false; S.netErr = ''; draw(); return (window.FS && FS.sync ? FS.sync.hydratePage() : Promise.resolve()).catch(() => { }).then(() => { S.loaded = true; probeNet(); loadFav(); softRefresh(); }); }
let _lastNotifIds = null;
function onNotifs() {   // thông báo mới đến khi app đang mở -> banner đầu màn hình
  const ids = new Set(NOTIFS.map(n => n.id));
  if (_lastNotifIds) NOTIFS.filter(n => !_lastNotifIds.has(n.id) && n.unread).slice(0, 2).forEach(n => push(n.icon, n.title, n.desc, notifTarget(n)));
  _lastNotifIds = ids;
}
function notifTarget(n) {
  if (n.sourceType === 'order-chat' && n.relatedId) return ['chat', n.relatedId];
  if (n.relatedType === 'complaint' && n.relatedId) { const c = COMPLAINTS.find(x => x.id === n.relatedId); if (c && orderOf(c.orderId)) return ['order', c.orderId]; }
  if (n.relatedType === 'order' && n.relatedId && orderOf(n.relatedId)) return ['order', n.relatedId];
  if (n.relatedType === 'product' && n.relatedId && prod(n.relatedId)) return ['detail', n.relatedId];
  if (/voucher/i.test(n.sourceType || '')) return ['vouchers'];
  return null;
}
window.addEventListener('online', () => { toast('Đã có mạng trở lại'); reloadAll(); });
window.addEventListener('offline', () => toast('Bạn đang mất kết nối mạng'));

async function loadPolicy() { try { S.policy = await API('/catalog/policy'); } catch (e) { /* không có thì ẩn số cụ thể */ } }
async function loadTrust() { try { S.trust = await API('/customers/me/trust'); } catch (e) { S.trust = null; } }
async function loadFav() {
  if (!S.user) return;
  try { const r = await API('/customers/favorites'); S.fav = new Set((r.products || []).map(x => x.product_id)); softRefresh(); } catch (e) { /* giữ nguyên */ }
}
const pol = lb => S.policy && S.policy.labels && S.policy.labels[lb];

/* ====================== ĐĂNG NHẬP / ĐĂNG KÝ ====================== */
const AUTH = () => window.FoodSaveAuth;
const sb = () => AUTH().getSupabaseClient();
const LOC_KEY = 'foodsave.nearby.location';   // cùng khóa với web (foodsave-live-data.js đọc khóa này để sắp xếp theo khoảng cách)

let _loginP = null;
function afterLogin() { if (!_loginP) _loginP = _afterLogin().finally(() => { _loginP = null; }); return _loginP; }
async function _afterLogin() {
  // 1) Lấy hồ sơ thật. Tài khoản không phải người mua thì chặn trước khi ghi bất cứ thứ gì.
  let profile;
  try { profile = await API('/profile/me'); }
  catch (e) {
    if (e && e.status === 401) { await doLogout(true); S.authChecked = true; root('welcome'); toast('Phiên đăng nhập đã hết hạn, vui lòng đăng nhập lại'); }
    else { S.authChecked = true; root('welcome'); toast(errMsg(e)); }
    return;
  }
  if (profile && profile.role && profile.role !== 'customer') { await wrongRole(profile.role); return; }
  S.user = profile; S.authChecked = true;
  S.otp = {};
  const meta = (profile && profile.metadata) || {};
  const complete = profile && profile.full_name && (profile.terms_accepted_at || meta.profile_completed_at);
  if (!complete) { go('profile'); return; }
  await enterApp();
}
async function wrongRole(role) {
  const name = { charity: 'tổ chức từ thiện', partner: 'cửa hàng', admin: 'quản trị' }[role] || role;
  await doLogout(true);
  root('welcome');
  sheet(`<h2><i class="ti ti-info-circle" style="color:#c48a00"></i> Tài khoản ${esc(name)}</h2><p class="sm mut mt8">Ứng dụng này chỉ dành cho <b>người mua</b>. Tài khoản của bạn là tài khoản ${esc(name)}, vui lòng đăng nhập ở cổng ${esc(name)} riêng của FoodSave.</p><button class="btn mt16" onclick="closeSheet()">Đã hiểu</button>`);
}
async function enterApp() {
  S.loaded = false;
  tab('home');
  loadPolicy(); loadTrust(); loadFav();
  if (!S.authedData) { try { await FS.sync.hydratePage(); } catch (e) { /* hydratePage bắt lỗi từng phần */ } }
  S.loaded = true; if (!PRODUCTS.length) probeNet();
  softRefresh();
  if (window.FSPwa) FSPwa.sync();   // đã bật thông báo từ trước: gửi lại thiết bị lên máy chủ (không trùng)
  startNotifPolling();
  openDeep();
}
/* Thông báo mới khi app đang mở: kiểm tra mỗi 20 giây (như web) -> banner đầu màn hình */
function startNotifPolling() {
  if (S._notifPoll) return;
  S._notifPoll = setInterval(() => { if (!document.hidden && S.user) FS.sync.refreshNotifications().catch(() => { }); }, 20000);
}
/* Mở đúng màn khi bấm thông báo đẩy: #order=<id> | #chat=<id> | #complaint=<id> | #voucher */
async function openDeep() {
  const h = location.hash || ''; if (!S.user || !/^#(order|chat|complaint|voucher)/.test(h)) return;
  const clear = () => { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* bỏ qua */ } };
  let m;
  if (h === '#voucher') { clear(); S.stack = [['tab', 'home'], ['vouchers']]; draw(); return; }
  let id = null, chat = false;
  if (m = h.match(/^#(order|chat)=([\w-]+)/)) { id = m[2]; chat = m[1] === 'chat'; }
  else if (m = h.match(/^#complaint=([\w-]+)/)) { const c = COMPLAINTS.find(x => x.id === m[1]); id = c ? c.orderId : null; }
  clear();
  if (!id) { tab('home'); return; }
  try { if (!orderOf(id)) await refreshOrder(id); } catch (e) { toast('Không mở được đơn hàng này'); return; }
  S.stack = [['tab', 'home'], ['order', id]]; if (chat) S.stack.push(['chat', id]); draw();
}
window.addEventListener('hashchange', openDeep);

/* ---------- cài đặt thông báo (nhóm lưu ở profiles.metadata.notification_prefs, máy chủ đọc khi gửi push) ---------- */
const NGROUPS = [['orders', 'ti-package', 'Đơn hàng', 'Thanh toán thành công, cửa hàng chuẩn bị xong, nhắc giờ nhận, hủy / hoàn tiền'], ['chat', 'ti-messages', 'Tin nhắn & khiếu nại', 'Cửa hàng nhắn tin, phản hồi và kết quả khiếu nại'], ['promo', 'ti-ticket', 'Khuyến mãi & voucher', 'Voucher mới, deal gần bạn']];
const prefOn = g => !(S.user && S.user.metadata && S.user.metadata.notification_prefs && S.user.metadata.notification_prefs[g] === false);
async function setPref(g, on) {
  const meta = { ...((S.user && S.user.metadata) || {}) }; const prev = meta.notification_prefs || {};
  meta.notification_prefs = { ...prev, [g]: !!on };
  const old = S.user.metadata; S.user.metadata = meta; draw();
  try { S.user = await API('/profile/me', { method: 'PATCH', body: { metadata: meta } }); }
  catch (e) { S.user.metadata = old; draw(); toast(errMsg(e)); }
}
async function togglePush() {
  if (!window.FSPwa) return; const i = FSPwa.info();
  if (S.busy) return; S.busy = true;
  try {
    if (i.subscribed) { await FSPwa.pushDisable(); toast('Đã tắt thông báo đẩy cho thiết bị này'); }
    else {
      if (i.permission === 'denied') { toast('Thông báo đang bị chặn. Hãy cho phép trong cài đặt trình duyệt / ứng dụng.'); return; }
      if (!i.supported) { toast(i.ios ? 'iPhone cần iOS 16.4 trở lên và đã thêm FoodSave vào Màn hình chính.' : 'Thiết bị này chưa hỗ trợ thông báo đẩy.'); return; }
      if (!i.serverEnabled) { toast('Thông báo đẩy chưa được bật trên máy chủ. Thông báo vẫn hiện trong app.'); return; }
      const ok = await FSPwa.pushEnable(); toast(ok ? 'Đã bật thông báo đẩy' : 'Bạn chưa cho phép thông báo');
    }
  } catch (e) { toast(errMsg(e)); } finally { S.busy = false; if (curScreen() === 'notifset') draw(); }
}
/* nội dung pháp lý dùng chung với web (frontend/foodsave-legal-content.js); "Liên hệ" chuyển sang gửi yêu cầu hỗ trợ trong app */
window.openLegal = k => { if (k === 'contact') { S.filt.ht = 'req'; go('help'); } else go('legaldoc', k); };
window.closeLegal = () => back();

// Phiên mới được lưu (Google/Facebook quay lại, hoặc Email OTP) -> kiểm tra vai trò rồi vào app
window.addEventListener('foodsave:session-saved', () => { if (!S.user) afterLogin(); });

function startOAuth(provider) {
  if (!navigator.onLine) { toast('Cần có mạng để đăng nhập'); return; }
  try { sessionStorage.setItem('foodsave.app.oauth', '1'); } catch (e) { /* bỏ qua */ }
  (provider === 'google' ? AUTH().startGoogleLogin : AUTH().startFacebookLogin)();
}

/* Gmail + OTP (Supabase signInWithOtp / verifyOtp type:'email') */
const EMAIL_RE = /^[^@\s]+@[^@\s]+\.[^@\s]+$/;
async function sendEmailOtp() {
  const el = document.getElementById('em'); const email = (el && el.value || '').trim().toLowerCase();
  if (!EMAIL_RE.test(email)) { toast('Email chưa đúng định dạng'); return; }
  if (S.busy) return; S.busy = true;
  try {
    const { error } = await sb().auth.signInWithOtp({ email, options: { shouldCreateUser: true } });
    if (error) throw error;
    S.otp = { kind: 'email', to: email, resendAt: now() + 60000 };
    go('otp');
  } catch (e) { toast('Không gửi được mã: ' + errMsg(e)); }
  finally { S.busy = false; }
}
/* SĐT + OTP (backend /auth/phone/otp và /auth/phone/verify, như web) */
async function sendPhoneOtp(resend) {
  const el = document.getElementById('ph'); const phone = resend ? S.otp.to : (el && el.value || '').trim();
  if (!phone || phone.replace(/\D/g, '').length < 9) { toast('Số điện thoại chưa đúng'); return; }
  if (S.busy) return; S.busy = true;
  try {
    const r = await API('/auth/phone/otp', { method: 'POST', body: { phone, expected_role: 'customer' } });

/* ====================== GAME CÂY (cùng logic + cùng khóa localStorage với web) ====================== */
const TREE_KEY = 'foodsave.treeGame.v1', TREE_CREDITED = 'foodsave.treeGame.creditedOrders.v1';
const T_FULL = 100, T_COST = 25, T_PT = 5, T_DONATE = 25, T_PER_ORDER = 25;
const stageKey = w => w >= 75 ? 'ready' : w >= 50 ? 'young' : w >= 25 ? 'bud' : 'sprout';
const stageLbl = w => ({ ready: 'Sắp ra quả', young: 'Cây non khỏe mạnh', bud: 'Chồi xanh', sprout: 'Mầm xanh' })[stageKey(w)];
const tnum = (v, d = 0) => Number.isFinite(Number(v)) ? Number(v) : d;
function treeRead() {
  let s = {}; try { s = JSON.parse(localStorage.getItem(TREE_KEY) || 'null') || {}; } catch (e) { /* bỏ qua */ }
  return { currentTree: Math.max(1, Math.floor(tnum(s.currentTree, 1))), water: Math.max(0, Math.min(T_FULL, tnum(s.water))), waterReserve: Math.max(0, Math.floor(tnum(s.waterReserve))),
    donatedTrees: Math.max(0, Math.floor(tnum(s.donatedTrees))), totalWaterings: Math.max(0, Math.floor(tnum(s.totalWaterings))), totalOrdersCredited: Math.max(0, Math.floor(tnum(s.totalOrdersCredited))), totalReputation: Math.max(0, Math.floor(tnum(s.totalReputation))), lastOrderId: s.lastOrderId || '', lastWaterEarnedAt: s.lastWaterEarnedAt || '', lastWateredAt: s.lastWateredAt || '', lastDonatedAt: s.lastDonatedAt || '' };
}
const treeSave = s => { try { localStorage.setItem(TREE_KEY, JSON.stringify(s)); } catch (e) { /* bỏ qua */ } };
function creditedRead() { try { const v = JSON.parse(localStorage.getItem(TREE_CREDITED) || '[]'); return Array.isArray(v) ? v.map(String) : []; } catch (e) { return []; } }
/* Cộng nước khi đơn đã THANH TOÁN THẬT (payment_status === 'paid' từ server), mỗi đơn một lần.
   Khóa chống trùng dùng "#<order_number>" giống mapUserOrder của web. */
function creditPaidOrders() {
  const done = creditedRead(); let changed = false; const s = treeRead();
  ORD.filter(o => o.payment_status === 'paid' && tms(o.paid_at) > now() - 2 * 3600000).forEach(o => {
    const key = '#' + o.order_number;
    if (done.includes(key)) return;
    s.waterReserve += T_PER_ORDER; s.totalOrdersCredited += 1; s.lastOrderId = key; s.lastWaterEarnedAt = new Date().toISOString();
    done.push(key); changed = true;
  });
  if (changed) { treeSave(s); try { localStorage.setItem(TREE_CREDITED, JSON.stringify(done)); } catch (e) { /* bỏ qua */ } }
  return changed;
}
function waterTree() {
  const t = treeRead();
  if (t.waterReserve < T_COST) { toast('Bạn chưa có nước. Hãy cứu thêm thực phẩm để nhận 25 giọt nước.'); return; }
  t.waterReserve -= T_COST; let w = t.water + T_COST, don = 0; while (w >= T_FULL) { don++; w -= T_FULL; }
  const pts = T_PT + don * T_DONATE; t.water = w; t.currentTree += don; t.donatedTrees += don; t.totalWaterings++; t.totalReputation += pts; t.lastWateredAt = new Date().toISOString(); if (don) t.lastDonatedAt = t.lastWateredAt;
  treeSave(t);
  const sc = document.getElementById('scene'); if (sc) { sc.classList.add('water'); if (don) sc.classList.add('harvest'); }
  setTimeout(() => { if (curScreen() === 'impact') draw(); toast(don ? '🎉 Cây đã trưởng thành và được góp vào quỹ xanh! +' + pts + ' điểm' : 'Đã tưới cây +25% · +' + pts + ' điểm xanh'); }, 1250);
}

  const leaf = (x, y, r, c) => `<ellipse cx="${x}" cy="${y}" rx="${r}" ry="${r * .55}" fill="${c}" transform="rotate(${x > 0 ? -28 : 28} ${x} ${y})"/>`;

  else if (k === 'bud') can = leaf(-26, -78, 20, '#3fbf6a') + leaf(26, -82, 20, '#2fa85a') + leaf(-12, -104, 18, '#56d27f') + leaf(14, -108, 18, '#3fbf6a');

}
function sceneHTML() {

          : `<div class="card row sm b" style="background:#eef1ee;border:0"><i class="ti ti-circle-x"></i>${o.status === 'no_show' ? 'Không đến nhận hàng' : 'Đơn đã hủy'}${CANCEL_TXT[o.cancel_reason] ? ' · ' + esc(CANCEL_TXT[o.cancel_reason]) : ''}</div>`;

 <div class="card mt12"><div class="xs b mut" style="text-transform:uppercase;margin-bottom:6px">Mặt hàng đã đặt</div>${items.map(i => { const p = prod(i.product_id) || { name: i.product_name, label: lb, cat: 'other' }; return `<div class="row" style="padding:6px 0"><div class="pimg ${p.label}" style="width:48px;height:48px;font-size:26px;border-radius:12px">${pic(p, 26)}</div><div class="grow"><b class="sm">${esc(i.product_name)}</b><div class="xs mut">x${i.quantity} · Nhãn ${LAB[p.label] ? LAB[p.label].n : ''}</div></div><b class="sm">${fmt(i.unit_price_cents * i.quantity)}</b></div>`; }).join('')}
  <div style="border-top:1px dashed var(--line);margin-top:8px;padding-top:8px" class="sm">${o.discount_cents ? `<div class="row between"><span class="mut">Giảm giá${o.voucher_code ? ' (' + esc(o.voucher_code) + ')' : ''}</span><b style="color:var(--g7)">-${fmt(o.discount_cents)}</b></div>` : ''}${o.platform_fee_cents ? `<div class="row between mt8"><span class="mut">Phí dịch vụ</span><b>${fmt(o.platform_fee_cents)}</b></div>` : ''}<div class="row between mt8"><span class="mut">${paid ? 'Đã thanh toán' : 'Tổng cộng'}</span><b style="font-size:16px">${fmt(o.total_cents)}</b></div></div></div>
 ${o.status === 'completed' ? `<div class="card mt12 row sm" style="background:var(--grbg);border:0"><i class="ti ti-star-filled" style="color:#e0a512"></i><b>Hoàn tất${S.policy ? ' · +' + S.policy.reputation.pickup_success + ' điểm uy tín' : ''}</b></div>` : ''}
 ${o.payment_status === 'refunded' ? `<div class="card mt12" style="background:var(--grbg);border:0"><div class="row"><i class="ti ti-cash" style="font-size:24px;color:var(--g8)"></i><div><b>Đã hoàn ${fmt(o.total_cents)}</b><div class="xs mut">${esc(CANCEL_TXT[o.cancel_reason] || 'Tiền đã được hoàn lại')}</div></div></div></div>` : ''}

function voucherEstimate(v, tot) {
  if (!v || (v.min && tot < v.min)) return 0;
  return v.percent ? Math.round(tot * v.percent / 100) : Math.min(v.fixed || 0, tot);
}
async function lookupVoucher(code) {
  code = String(code || '').trim().toUpperCase(); if (!code) return null;
  let v = VOUCHERS.find(x => x.code === code);
  if (v) return v;
  const r = await API('/catalog/vouchers?code=' + encodeURIComponent(code));
  const x = Array.isArray(r) && r[0]; if (!x) return null;
  return { code: x.code, name: x.name, percent: x.percent_off, fixed: Math.round(Number(x.fixed_discount_cents) || 0), min: Math.round(Number(x.min_order_cents) || 0), expiry: x.expires_at ? dmy(x.expires_at) : '' };
}

  const list = S.cart.map(c => ({ c, p: prod(c.p) }));
  if (list.some(r => !r.p)) { toast('Có sản phẩm không còn bán, vui lòng kiểm tra giỏ hàng'); go('cart'); return; }
  const u = S.user || {};
  const body = { items: list.map(r => ({ product_id: r.c.p, quantity: r.c.q })), pickup_slot_key: 'policy', payment_method: S.pm, donation_cents: 0 };
  if (S.voucher) body.voucher_code = S.voucher.code;
  if (u.full_name && u.full_name.trim().length >= 2) body.receiver_name = u.full_name.trim().slice(0, 140);
  if (u.phone && u.phone.replace(/\D/g, '').length >= 8 && u.phone.length <= 20) body.receiver_phone = u.phone;
  if (u.email && EMAIL_RE.test(u.email)) body.receiver_email = u.email;
  S.busy = true; const btn = document.getElementById('paybtn'); if (btn) { btn.disabled = true; btn.textContent = 'Đang tạo đơn…'; }
  try {
    const res = S.pm === 'momo' ? await FS.sync.createMomoPayment(body) : await FS.sync.pushOrder(body);
    if (!res || !res.order || !res.order.id) throw new Error('Không tạo được đơn hàng');
    const id = res.order.id;
    S.payInit = S.payInit || {}; S.payInit[id] = res.payment || {};
    S.cart = []; saveCart(); S.voucher = null;
    await refreshOrder(id).catch(() => { ORD.unshift({ ...res.order, order_items: res.items || [] }); });
    S.stack = [['tab', 'home'], ['paying', id]]; draw();
  } catch (e) {
    toast(errMsg(e));
    if (e && /product|stock|hết|conflict/i.test(e.code || e.message || '')) { reloadAll(); }
  } finally { S.busy = false; if (btn) { btn.disabled = false; btn.textContent = 'Đặt hàng & thanh toán'; } }
}
async function confirmPay(id) {
  if (S.busy) return; S.busy = true; const b = document.getElementById('cfbtn'); if (b) b.disabled = true;
  try { const o = orderOf(id); await FS.sync.markOrderPaymentPaid(id, o && o.payment_method); const x = await refreshOrder(id); if (x && isPaid(x)) afterPaid(id); }
  catch (e) {
    if (e && e.code === 'PAYMENT_EXPIRED') { toast('Đơn đã quá hạn thanh toán và được hủy'); await refreshOrder(id).catch(() => { }); S.stack = [['tab', 'orders']]; S.tab = 'orders'; draw(); }
    else toast(errMsg(e));
  } finally { S.busy = false; if (b) b.disabled = false; }
}
function afterPaid(id) {
  clearTimers();
  const o = orderOf(id);
  creditPaidOrders();
  S.stack = [['tab', 'home'], ['order', id]]; draw();
  push('ti-circle-check', 'Thanh toán thành công!', 'Đơn #' + (o ? o.order_number : '') + ' đã được ghi nhận. +25 giọt nước cho cây uy tín', ['order', id]);
  loadTrust();
}
async function abandonPay(id) {
  try { await FS.sync.cancelOrder(id, 'Hủy khi chưa thanh toán'); await refreshOrder(id).catch(() => { }); toast('Đã hủy đơn chưa thanh toán'); S.stack = [['tab', 'home']]; S.tab = 'home'; draw(); } catch (e) { toast(errMsg(e)); }
}

/* ---------- hủy đơn: số liệu hiển thị lấy từ GET /orders/:id/cancel-preview (server tính) ---------- */
async function cancelSheet(id) {
  sheet('<h2>Xác nhận huỷ đơn</h2><div class="row mt16" style="justify-content:center"><div style="width:26px;height:26px;border:3px solid var(--grbg);border-top-color:var(--g7);border-radius:50%;animation:sp 1s linear infinite"></div></div>');
  let pv;
  try { pv = await API('/orders/' + encodeURIComponent(id) + '/cancel-preview'); } catch (e) { sheet(`<h2>Không xem được kết quả huỷ</h2><p class="sm mut mt8">${esc(errMsg(e))}</p><button class="btn mt16" onclick="closeSheet()">Đóng</button>`); return; }
  if (!pv.can_cancel) { sheet(`<h2>Không thể huỷ</h2><p class="sm mut mt8">${esc(pv.message)}</p><button class="btn mt16" onclick="closeSheet()">Đóng</button>`); return; }
  const o = orderOf(id), full = pv.free;
  sheet(`<h2 class="row" style="gap:8px"><i class="ti ti-alert-triangle" style="color:${full ? '#c48a00' : 'var(--red)'}"></i>Xác nhận huỷ đơn</h2><p class="sm mut mt8">Bạn có chắc muốn huỷ đơn #${esc(o ? o.order_number : '')}?</p>
 <div class="card mt12" style="background:${full ? 'var(--grbg)' : 'var(--redbg)'};border:0">${pv.paid ? `<div class="row between sm"><span><i class="ti ti-cash"></i> Hoàn tiền</span><b style="color:${full ? 'var(--g8)' : 'var(--red)'}">${fmt(pv.refund_cents)}</b></div><div class="row between sm mt8"><span><i class="ti ti-star"></i> Điểm uy tín</span><b style="color:${full ? 'var(--g8)' : 'var(--red)'}">${pv.penalty_points ? '-' + pv.penalty_points + ' điểm' : '0'}</b></div>` : ''}
 <div class="xs mut ${pv.paid ? 'mt8' : ''}">${esc(pv.message)}${pv.paid && pv.cancel_free_until && full ? ' (miễn phí đến ' + hhmm(pv.cancel_free_until) + ')' : ''}</div></div>
 <button class="btn red mt16" id="docancel" onclick="doCancel('${q1(id)}')">Xác nhận huỷ</button><button class="b sm mt12" style="width:100%;color:var(--mut)" onclick="closeSheet()">Giữ lại đơn hàng</button>`);
}
async function doCancel(id) {
  const b = document.getElementById('docancel'); if (b) b.disabled = true;
  try {
    const r = await FS.sync.cancelOrder(id);
    closeSheet(); await refreshOrder(id).catch(() => { }); loadTrust();
    S.filt.ot = 'cancel'; S.stack = [['tab', 'orders']]; S.tab = 'orders'; draw();
    toast(r && r.refunded ? 'Đã huỷ – hoàn ' + fmt(r.refund_cents) : 'Đã huỷ đơn');
  } catch (e) { if (b) b.disabled = false; closeSheet(); toast(errMsg(e)); }
}

/* ---------- khiếu nại: ảnh bắt buộc, tải lên Supabase Storage qua upload-url (như web) ---------- */
const CP_REASONS = [['wrong_item', 'Giao sai sản phẩm'], ['spoiled_expired', 'Hư hỏng / hết hạn'], ['missing_items', 'Thiếu sản phẩm'], ['other', 'Khác']];
function complaintSheet(id) { S.cp = { id, reason: 'wrong_item', issue: '', urls: [], uploading: false, sending: false }; renderCP(); }
function renderCP() {
  const c = S.cp; if (!c) return;
  sheet(`<h2>Khiếu nại đơn #${esc((orderOf(c.id) || {}).order_number || '')}</h2><p class="xs mut mt8">Cửa hàng có ${S.policy ? S.policy.complaint.store_response_hours : 12} giờ để phản hồi. Cần ảnh minh chứng. Khiếu nại sai sự thật sẽ bị trừ điểm uy tín.</p>
 <label class="l">Lý do</label><div class="row" style="flex-wrap:wrap;gap:6px">${CP_REASONS.map(r => `<button class="pill ${c.reason === r[0] ? 'on' : ''}" onclick="S.cp.reason='${r[0]}';renderCP()">${r[1]}</button>`).join('')}</div>
 <label class="l">Mô tả chi tiết (tối thiểu 10 ký tự)</label><textarea class="field" rows="3" maxlength="2000" placeholder="Mô tả vấn đề…" oninput="S.cp.issue=this.value">${esc(c.issue)}</textarea>
 <label class="l">Ảnh minh chứng * (${c.urls.length}/5)</label>
 <div class="row" style="flex-wrap:wrap;gap:8px">${c.urls.map((u, i) => `<div style="position:relative"><img src="${esc(u)}" alt="" style="width:64px;height:64px;border-radius:12px;object-fit:cover"><button class="ib" style="position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%" onclick="S.cp.urls.splice(${i},1);renderCP()"><i class="ti ti-x" style="font-size:12px"></i></button></div>`).join('')}
 ${c.urls.length < 5 ? `<label class="sopt" style="width:auto;margin:0;padding:10px 14px;cursor:pointer"><span class="ico"><i class="ti ti-camera"></i></span>${c.uploading ? 'Đang tải ảnh…' : 'Chụp / chọn ảnh'}<input type="file" accept="image/jpeg,image/png,image/webp" multiple hidden onchange="cpFiles(this.files)" ${c.uploading ? 'disabled' : ''}></label>` : ''}</div>
 <div class="xs mut mt8">JPG / PNG / WEBP · tối đa 5MB mỗi ảnh</div>
 <button class="btn mt16" id="cpsend" ${c.uploading || c.sending ? 'disabled' : ''} onclick="cpSend()">Gửi khiếu nại</button>`);
}
async function cpFiles(fileList) {
  const c = S.cp; if (!c) return;
  const files = [...fileList].slice(0, 5 - c.urls.length); c.uploading = true; renderCP();
  try {
    for (const f of files) {
      if (!['image/jpeg', 'image/png', 'image/webp'].includes(f.type)) { toast('Chỉ nhận ảnh JPG, PNG hoặc WEBP'); continue; }
      if (f.size > 5 * 1024 * 1024) { toast('Ảnh quá 5MB: ' + f.name); continue; }
      const up = await API('/orders/complaints/upload-url', { method: 'POST', body: { content_type: f.type } });
      const r = await sb().storage.from('partner-assets').uploadToSignedUrl(up.path, up.token, f, { contentType: f.type });
      if (r && r.error) throw new Error('Không tải được ảnh lên, vui lòng thử lại');
      c.urls.push(up.public_url);
    }
  } catch (e) { toast(errMsg(e)); }
  c.uploading = false; renderCP();
}
async function cpSend() {
  const c = S.cp; if (!c || c.sending) return;
  if ((c.issue || '').trim().length < 10) { toast('Vui lòng mô tả vấn đề tối thiểu 10 ký tự'); return; }
  if (!c.urls.length) { toast('Cần gửi ít nhất 1 ảnh minh chứng'); return; }
  c.sending = true;
  try {
    await FS.sync.pushComplaint({ order_id: c.id, reason_code: c.reason, issue: c.issue.trim(), image_urls: c.urls });
    S.cp = null; closeSheet(); toast('Đã gửi khiếu nại');
    await FS.sync.hydratePage().catch(() => { }); softRefresh();
  } catch (e) { c.sending = false; toast(errMsg(e)); if (e && (e.code === 'COMPLAINT_WINDOW_CLOSED' || e.code === 'COMPLAINT_ALREADY_EXISTS')) { S.cp = null; closeSheet(); FS.sync.hydratePage().catch(() => { }); } }
}

/* ---------- chat theo đơn (order_messages): polling 6 giây ---------- */
async function loadChat(id) {
  try {
    const r = await API('/orders/' + encodeURIComponent(id) + '/messages');
    const old = S.chat[id], key = m => (m.messages || []).map(x => x.id).join(',') + '|' + m.can_send;
    S.chat[id] = r;
    if (curScreen() === 'chat' && (!old || key(old) !== key(r))) { const ae = document.activeElement, typed = ae && ae.id === 'cm' ? ae.value : ''; draw(); const el = document.getElementById('cm'); if (el && typed) { el.value = typed; el.focus(); } const m = document.getElementById('msgs'); if (m) m.scrollTop = 1e6; }
    API('/orders/' + encodeURIComponent(id) + '/messages/read', { method: 'POST' }).catch(() => { });
  } catch (e) { if (!S.chat[id]) { S.chat[id] = { messages: [], can_send: false }; if (curScreen() === 'chat') draw(); toast(errMsg(e)); } }
}
async function sendChat(id, txt) {
  const el = document.getElementById('cm'); const body = (txt || (el && el.value) || '').trim();
  if (!body) return;
  try { await API('/orders/' + encodeURIComponent(id) + '/messages', { method: 'POST', body: { body } }); if (el) el.value = ''; await loadChat(id); }
  catch (e) { toast(errMsg(e)); }
}

/* ---------- hỗ trợ: gửi qua POST /support/contact (API có sẵn) ---------- */
function ticketSheet() {
  const u = S.user || {}, em = u.email || (u.metadata && u.metadata.contact_email) || '';
  sheet(`<h2>Tạo yêu cầu mới</h2><label class="l">Tiêu đề *</label><input id="tks" class="field" maxlength="180" placeholder="Ví dụ: Không nhận được mã đặt hàng">
 ${em ? '' : '<label class="l">Email nhận phản hồi *</label><input id="tke" class="field" type="email" placeholder="email@example.com">'}
 <label class="l">Nội dung cần giải quyết * (tối thiểu 10 ký tự)</label><textarea id="tk" class="field" rows="4" maxlength="2000" placeholder="Mô tả chi tiết vấn đề…"></textarea>
 <div class="row mt16"><button class="btn ghost" onclick="closeSheet()">Hủy</button><button class="btn" id="tksend" onclick="sendTicket('${esc(em)}')">Gửi yêu cầu</button></div>`);
}
async function sendTicket(em) {
  const u = S.user || {}, subject = (document.getElementById('tks').value || '').trim(), message = (document.getElementById('tk').value || '').trim();
  const email = em || (document.getElementById('tke') && document.getElementById('tke').value.trim()) || '';
  if (subject.length < 2) { toast('Nhập tiêu đề'); return; }
  if (message.length < 10) { toast('Nội dung tối thiểu 10 ký tự'); return; }
  if (!EMAIL_RE.test(email)) { toast('Cần email hợp lệ để nhận phản hồi'); return; }
  const b = document.getElementById('tksend'); if (b) b.disabled = true;
  try {
    const body = { full_name: (u.full_name || 'Khách hàng').slice(0, 140), email, subject, message };
    if (u.phone && u.phone.length >= 8 && u.phone.length <= 30) body.phone = u.phone;
    await API('/support/contact', { method: 'POST', body }); closeSheet(); toast('Đã gửi yêu cầu. FoodSave sẽ phản hồi qua email.');
  } catch (e) { if (b) b.disabled = false; toast(errMsg(e)); }
}

/* ====================== KHỞI ĐỘNG ====================== */
/* Nhắc cập nhật khi có service worker (phiên bản) mới */
function watchUpdates() {
  if (!('serviceWorker' in navigator)) return;
  const had = !!navigator.serviceWorker.controller; let shown = false;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!had || shown) return; shown = true;
    sheet('<h2><i class="ti ti-refresh" style="color:var(--g7)"></i> Có phiên bản mới</h2><p class="sm mut mt8">FoodSave vừa được cập nhật. Tải lại để dùng bản mới nhất.</p><button class="btn mt16" onclick="location.reload()">Tải lại ngay</button><button class="b sm mt12" style="width:100%;color:var(--mut)" onclick="closeSheet()">Để sau</button>');
  });
}
function hasOAuthReturn() { return /[#&?](access_token|code|error_description)=/.test(location.hash + location.search) || sessionStorage.getItem('foodsave.app.oauth') === '1'; }
async function boot() {
  S.loc = readLoc();
  if (window.FSPwa) FSPwa.init({ role: 'customer', client: 'app', ui: false, request: API });   // đăng ký service worker (offline.html, push); app tự vẽ nút bật/tắt thông báo
  watchUpdates();
  root('boot');
  const sess = AUTH().readSession();
  const oauth = hasOAuthReturn();
  if (!sess && !oauth) { S.authChecked = true; root('welcome'); return; }
  if (oauth && !sess) {   // chờ Supabase đổi mã/token trong URL thành phiên (sự kiện foodsave:session-saved)
    root('oauth');
    setTimeout(() => { if (!S.user && curScreen() === 'oauth') { sessionStorage.removeItem('foodsave.app.oauth'); S.authChecked = true; root('welcome'); toast('Đăng nhập chưa hoàn tất, vui lòng thử lại'); } }, 12000);
    return;
  }
  await afterLogin();
  if (curScreen() === 'boot') root('welcome');
}
try { sessionStorage.removeItem('foodsave.app.oauth'); } catch (e) { /* bỏ qua */ }
window.addEventListener('foodsave:session-saved', () => { try { sessionStorage.removeItem('foodsave.app.oauth'); if (/[#?]/.test(location.href) && hasOAuthReturn()) history.replaceState(null, '', location.pathname); } catch (e) { /* bỏ qua */ } });
document.addEventListener('DOMContentLoaded', boot);

</script>
