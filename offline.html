<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">

<meta name="theme-color" content="#006C4D">
<title>FoodSave - Mất kết nối</title>
<style>

  p{font-size:14px;line-height:1.6;margin:0 0 20px;color:#4b5f54}

<body>
  <div class="box">
    <div class="ic">📡</div>

    <button type="button" onclick="location.reload()">Thử lại</button>
  </div>
