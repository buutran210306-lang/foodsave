<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>FoodSave App · Demo giao diện</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--g9:#0f4a2e;--g8:#14613b;--g7:#1c7c45;--g5:#22a55b;--mint:#eaf6ef;--mint2:#d9efe2;--y:#f3c94f;--ink:#111512;--mut:#6b756d;--line:#e2e9e3;--red:#dc3b2f;--redbg:#fde8e6;--ylbg:#fff4d1;--grbg:#dff3e7;--bg:#f3f8f4;--af:430px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{background:#dfe6e0}
body{font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);max-width:var(--af);margin:0 auto;height:100vh;height:100dvh;position:relative;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.15)}
button{font-family:inherit;cursor:pointer;border:0;background:none;color:inherit}
input,textarea{font-family:inherit;font-size:15px;color:inherit}
i.ti{font-size:20px;line-height:1}
#view{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:none}
#view::-webkit-scrollbar{display:none}
.scr{min-height:100%;padding-bottom:20px;animation:in .22s ease-out}
.scr.tabbed{padding-bottom:96px}
@keyframes in{from{opacity:0;transform:translateX(14px)}to{opacity:1;transform:none}}
h1{font-size:26px;font-weight:900;line-height:1.1;letter-spacing:-.01em;text-transform:uppercase}
h2{font-size:17px;font-weight:800}
.mut{color:var(--mut)}.sm{font-size:12.5px}.xs{font-size:11px}.b{font-weight:800}
.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.grow{flex:1;min-width:0}
.pad{padding:0 16px}.mt8{margin-top:8px}.mt12{margin-top:12px}.mt16{margin-top:16px}.mt20{margin-top:20px}
.card{background:#fff;border-radius:18px;padding:14px;box-shadow:0 2px 10px rgba(15,74,46,.06);border:1px solid #edf2ee}
.btn{height:50px;border-radius:15px;background:var(--g8);color:#fff;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-shadow:0 6px 16px rgba(20,97,59,.25)}
.btn.ghost{background:#fff;color:var(--g8);border:1.5px solid var(--g8);box-shadow:none}
.btn.red{background:var(--red);box-shadow:none}
.btn.soft{background:var(--mint2);color:var(--g8);box-shadow:none}
.btn.sm{height:38px;font-size:13px;border-radius:12px;width:auto;padding:0 14px}
.btn[disabled]{opacity:.45}
.top{display:flex;align-items:center;gap:10px;padding:calc(14px + env(safe-area-inset-top)) 16px 10px;position:sticky;top:0;background:var(--bg);z-index:20}
.top h3{font-size:16px;font-weight:900;text-transform:uppercase;flex:1}
.ib{width:40px;height:40px;border-radius:13px;background:#fff;display:grid;place-items:center;border:1px solid var(--line);position:relative;flex:none}
.ib .dot{position:absolute;top:-4px;right:-4px;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:800;display:grid;place-items:center;padding:0 4px}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;border-radius:7px;padding:3px 7px;text-transform:uppercase;letter-spacing:.02em}
.tag.green{background:var(--g7);color:#fff}.tag.yellow{background:#e0a512;color:#fff}.tag.red{background:var(--red);color:#fff}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;border-radius:8px;padding:3px 8px;background:var(--grbg);color:var(--g8)}
.chip.y{background:var(--ylbg);color:#8a5a00}.chip.r{background:var(--redbg);color:#b3261e}.chip.g{background:#eef1ee;color:#586159}
.hs{display:flex;gap:10px;overflow-x:auto;padding:2px 16px 6px;scrollbar-width:none;scroll-padding-left:16px}.hs::-webkit-scrollbar{display:none}
.pill{flex:none;padding:9px 15px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:13px}
.pill.on{background:var(--g8);color:#fff;border-color:var(--g8)}
/* tab bar */
#tabs{position:absolute;left:0;right:0;bottom:0;background:rgba(255,255,255,.97);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:none;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(8px + env(safe-area-inset-bottom));z-index:50}
#tabs.on{display:grid}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;font-weight:800;color:#8b958d;padding:5px 0;text-transform:uppercase;position:relative}
#tabs button i{font-size:23px}
#tabs button.on{color:var(--g8)}
#tabs button.on:after{content:"";width:5px;height:5px;border-radius:50%;background:var(--g7);margin-top:1px}
#tabs .bd{position:absolute;top:2px;left:calc(50% + 6px);min-width:16px;height:16px;border-radius:8px;background:var(--red);color:#fff;font-size:9.5px;display:grid;place-items:center;padding:0 4px}
/* product row */
.prod{display:flex;gap:12px;padding:12px;background:#fff;border-radius:18px;border:1px solid #edf2ee;box-shadow:0 2px 10px rgba(15,74,46,.05);position:relative;margin-bottom:10px;cursor:pointer}
.pimg{width:84px;height:84px;border-radius:16px;display:grid;place-items:center;font-size:44px;flex:none;position:relative}
.pimg{overflow:visible}.pimg img{width:100%;height:100%;object-fit:cover;border-radius:16px;display:block}.pimg.green{background:linear-gradient(135deg,#d9f2e2,#f1fbf4)}.pimg.yellow{background:linear-gradient(135deg,#fff0bf,#fffaea)}.pimg.red{background:linear-gradient(135deg,#fbd6d2,#fff1ef)}
.pname{font-weight:800;font-size:15px;line-height:1.2}
.price{font-weight:900;font-size:17px;color:var(--red)}.price s{font-size:11.5px;font-weight:600;color:#9aa39c;margin-left:4px}
.off{background:var(--red);color:#fff;font-size:10.5px;font-weight:800;border-radius:6px;padding:2px 6px;margin-left:6px}
.heart{position:absolute;top:10px;right:10px;font-size:19px;color:#9aa39c}.heart.on{color:var(--red)}
/* hero */
.hero{margin:6px 16px 0;border-radius:22px;background:linear-gradient(120deg,var(--g9),var(--g7));color:#fff;padding:18px;position:relative;overflow:hidden;min-height:150px}
.hero h2{font-size:23px;line-height:1.1;font-weight:900}.hero p{font-size:12.5px;opacity:.9;margin:6px 0 12px}
.hero .big{position:absolute;right:10px;bottom:0;font-size:92px;opacity:.95}
.hero .b2{background:#fff;color:var(--g8);border-radius:11px;padding:9px 14px;font-weight:800;font-size:12.5px;display:inline-flex;gap:6px;align-items:center}
.lab{border-radius:18px;padding:13px;display:flex;flex-direction:column;gap:3px;text-align:left}
.lab.green{background:var(--grbg)}.lab.yellow{background:var(--ylbg)}.lab.red{background:var(--redbg)}
.lab .ic{width:34px;height:34px;border-radius:50%;background:#fff;display:grid;place-items:center;margin-bottom:5px}
.lab b{font-size:13.5px}.lab small{font-size:10.5px;color:var(--mut)}.lab em{font-style:normal;font-weight:900;font-size:13px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mapbox{margin:0 16px;height:150px;border-radius:18px;background:#cfe6dc;position:relative;overflow:hidden;border:1px solid var(--line)}
.mapbox:before{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent 48%,#fff 48% 52%,transparent 52%),linear-gradient(0deg,transparent 48%,#fff 48% 52%,transparent 52%),repeating-linear-gradient(60deg,transparent 0 40px,rgba(255,255,255,.5) 40px 43px);opacity:.9}
.pin{position:absolute;background:#fff;border-radius:99px;padding:3px 8px;font-size:11px;font-weight:800;box-shadow:0 3px 8px rgba(0,0,0,.18);display:flex;gap:3px;align-items:center;z-index:2}
.me{position:absolute;left:50%;top:55%;width:18px;height:18px;border-radius:50%;background:#2f6bf0;border:3px solid #fff;box-shadow:0 0 0 8px rgba(47,107,240,.2);z-index:2}
/* forms */
.field{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:13px 14px;width:100%;outline:none}
.field:focus{border-color:var(--g7)}
label.l{display:block;font-size:11px;font-weight:800;text-transform:uppercase;color:#3d4a41;margin:14px 0 6px;letter-spacing:.03em}
.steps{display:flex;gap:5px;margin-left:auto}.steps i{width:22px;height:4px;border-radius:3px;background:#cfe0d5}.steps i.on{background:var(--g8)}
.otp{display:flex;gap:8px;justify-content:space-between}.otp input{width:100%;aspect-ratio:1/1.15;text-align:center;font-size:22px;font-weight:800;border:1.5px solid var(--g5);background:var(--grbg);border-radius:12px;outline:none;min-width:0}
.sw{display:flex;background:var(--mint2);border-radius:13px;padding:4px}.sw button{flex:1;padding:10px 0;border-radius:10px;font-weight:800;font-size:13px;color:var(--mut)}.sw button.on{background:#fff;color:var(--g8);box-shadow:0 2px 6px rgba(0,0,0,.08)}
.sopt{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:10px;width:100%;text-align:left;font-weight:700}
.sopt .ico{width:36px;height:36px;border-radius:11px;background:var(--grbg);color:var(--g8);display:grid;place-items:center;flex:none}
/* sheet & toast */
#sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:90;display:none}
#sheetbg.on{display:block}
#sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:24px 24px 0 0;z-index:100;padding:10px 18px calc(18px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .28s cubic-bezier(.2,.8,.2,1);max-height:88%;overflow-y:auto}
#sheet.on{transform:none}
#sheet:before{content:"";display:block;width:38px;height:4px;border-radius:3px;background:#d5ddd6;margin:0 auto 12px}
#pushb{position:absolute;left:10px;right:10px;top:10px;z-index:300;background:linear-gradient(120deg,var(--g9),var(--g7));color:#fff;border-radius:18px;padding:12px 14px;display:flex;gap:11px;align-items:center;box-shadow:0 14px 36px rgba(0,0,0,.35);transform:translateY(-140%);transition:transform .4s cubic-bezier(.2,1.2,.4,1);cursor:pointer}#pushb.on{transform:none}#pushb .ic{width:40px;height:40px;border-radius:13px;background:#fff3;display:grid;place-items:center;flex:none}#pushb b{font-size:13.5px;display:block}#pushb span{font-size:12px;opacity:.9}#pushb em{font-style:normal;font-size:10px;opacity:.7;margin-left:auto;align-self:flex-start}
#toast{position:absolute;left:16px;right:16px;bottom:96px;background:#111512;color:#fff;padding:12px 16px;border-radius:14px;font-weight:700;font-size:13.5px;z-index:200;opacity:0;pointer-events:none;transform:translateY(10px);transition:.25s}
#toast.on{opacity:1;transform:none}
.timer{font-variant-numeric:tabular-nums;font-weight:900}
.bar{height:6px;border-radius:4px;background:#d3e6da;overflow:hidden}.bar i{display:block;height:100%;background:var(--g7);border-radius:4px}
.stepper{display:flex;align-items:flex-start;justify-content:space-between;margin:6px 0}
.stp{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:9.5px;font-weight:800;color:#8b958d;text-transform:uppercase;flex:1;position:relative}
.stp b{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#e4ece6;color:#9aa39c;font-size:12px;position:relative;z-index:1}
.stp.done b,.stp.cur b{background:var(--g7);color:#fff}.stp.cur b{box-shadow:0 0 0 4px rgba(34,165,91,.25)}.stp.done,.stp.cur{color:var(--g8)}
.stp:not(:last-child):after{content:"";position:absolute;top:12px;left:calc(50% + 14px);right:calc(-50% + 14px);height:2px;background:#d3e2d8}
.stp.done:not(:last-child):after{background:var(--g7)}
.qrbox{background:#fff;border:2px solid var(--g7);border-radius:22px;padding:16px;text-align:center}
.qrbox svg{width:190px;height:190px;border:1px solid var(--line);border-radius:14px;padding:8px}
.bub{max-width:78%;padding:10px 13px;border-radius:16px;font-size:14px;line-height:1.35;margin-bottom:8px}
.bub.mine{background:var(--g8);color:#fff;margin-left:auto;border-bottom-right-radius:5px}
.bub.you{background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.bub small{display:block;font-size:10px;opacity:.65;margin-top:3px}
.menu{background:#fff;border-radius:18px;border:1px solid #edf2ee;overflow:hidden}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:14px;font-weight:700;font-size:14.5px;text-align:left;border-bottom:1px solid #f1f4f1}
.menu button:last-child{border:0}.menu i.ti:first-child{color:var(--g7)}.menu .chev{margin-left:auto;color:#a2aba4;font-size:17px}
.splash{background:linear-gradient(170deg,rgba(15,74,46,.55),rgba(20,97,59,.9)),url('https://images.unsplash.com/photo-1542838132-92c53300491e?auto=format&fit=crop&w=1000&q=80') center/cover,var(--g9);color:#fff;min-height:100%}
.empty{text-align:center;padding:50px 24px;color:var(--mut)}.empty .e{font-size:50px}
.seg{display:flex;border-bottom:1px solid var(--line);margin:0 16px}.seg button{flex:1;padding:12px 0;font-weight:800;font-size:12.5px;color:#8b958d;text-transform:uppercase;border-bottom:3px solid transparent}.seg button.on{color:var(--g8);border-color:var(--g8)}
.acc{background:#fff;border-radius:14px;border:1px solid #edf2ee;margin-bottom:8px;overflow:hidden}.acc button{width:100%;padding:14px;text-align:left;font-weight:700;display:flex;justify-content:space-between;gap:8px}.acc div{display:none;padding:0 14px 14px;font-size:13.5px;color:#4a554d;line-height:1.5}.acc.on div{display:block}

/* ===== game cây ===== */
.garden{border-radius:24px;overflow:hidden;background:#fff;border:1px solid #edf2ee;box-shadow:0 4px 18px rgba(15,74,46,.1)}
.scene{position:relative;height:370px;background:linear-gradient(180deg,#bfe6ff 0%,#e6f7ff 55%,#dff3e7 100%);overflow:hidden}
.scene[data-stage=young],.scene[data-stage=ready]{background:linear-gradient(180deg,#a9ddff 0%,#e6f7ff 55%,#d9f2e2 100%)}
.scene svg.tree{position:absolute;left:0;right:0;bottom:66px;width:100%;height:270px;overflow:visible}
.sun{position:absolute;right:22px;top:20px;width:46px;height:46px;border-radius:50%;background:#ffe066;box-shadow:0 0 0 10px #ffe06655,0 0 0 22px #ffe06622}
.cloud{position:absolute;height:18px;width:60px;background:#fff;border-radius:99px;opacity:.9;animation:drift 22s linear infinite}
.cloud:before,.cloud:after{content:"";position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:26px;height:26px;left:10px;top:-12px}.cloud:after{width:20px;height:20px;left:30px;top:-8px}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(480px)}}
.scene .sign{position:absolute;left:14px;bottom:78px;background:#8a5a2b;color:#fff;font-size:10.5px;font-weight:800;border-radius:8px;padding:5px 9px;line-height:1.2;box-shadow:0 3px 0 #5e3b19}
.scene .sign span{display:block;font-size:15px;color:#ffe9a8}
.tools{position:absolute;left:12px;top:12px;display:grid;gap:8px}
.tools button{width:50px;border-radius:14px;background:#fff;color:var(--g8);font-size:9.5px;font-weight:800;padding:7px 0 5px;display:flex;flex-direction:column;align-items:center;gap:1px;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.tools button:nth-child(2){background:linear-gradient(135deg,#ffd54a,#ff9f43);color:#7a3a00}
.boost{position:absolute;right:12px;top:84px;background:#fff;border-radius:14px;padding:6px 10px;font-size:10px;font-weight:700;color:var(--mut);box-shadow:0 3px 10px rgba(0,0,0,.1);line-height:1.2;text-align:center}
.boost b{display:block;font-size:17px;color:#e07a00}
.dock{position:absolute;left:10px;right:10px;bottom:8px;display:flex;gap:8px;align-items:center;background:#fffffff2;border-radius:18px;padding:8px;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.dock .res{display:flex;align-items:center;gap:6px;padding:0 6px;min-width:70px}
.dock .res i{color:#2a9df4;font-size:24px}.dock .res b{font-size:17px;display:block;line-height:1}.dock .res span{font-size:9.5px;color:var(--mut);font-weight:700}
.dock .wbtn{flex:1;height:44px;border-radius:13px;background:linear-gradient(135deg,#2a9df4,#1b6fd1);color:#fff;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px}
.dock .wbtn[disabled]{background:#c9d3cc;color:#fff}
.dock .wbtn.alt{flex:none;background:var(--grbg);color:var(--g8);padding:0 12px;font-size:12.5px}
.drops{position:absolute;left:0;right:0;top:0;bottom:0;pointer-events:none}
.drops i{position:absolute;top:-20px;font-style:normal;font-size:22px;opacity:0}
.scene.water .drops i{animation:fall .9s ease-in forwards}
.drops i:nth-child(1){left:44%}.drops i:nth-child(2){left:52%;animation-delay:.12s!important}.drops i:nth-child(3){left:48%;animation-delay:.25s!important}.drops i:nth-child(4){left:56%;animation-delay:.18s!important}.drops i:nth-child(5){left:40%;animation-delay:.3s!important}
@keyframes fall{0%{opacity:0;transform:translateY(0)}15%{opacity:1}100%{opacity:0;transform:translateY(190px)}}
.scene.water svg.tree{animation:pop .7s .55s ease-out}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
.scene.harvest:after{content:"🎉 🌟 🎊 ✨ 🎉";position:absolute;left:0;right:0;top:40px;text-align:center;font-size:28px;animation:conf 1.6s ease-out forwards;letter-spacing:8px}
@keyframes conf{0%{opacity:0;transform:translateY(40px) scale(.6)}30%{opacity:1}100%{opacity:0;transform:translateY(-30px) scale(1.2)}}
.can{position:absolute;left:30%;top:30px;font-size:46px;opacity:0;transform:rotate(0)}
.scene.water .can{animation:cantilt 1.1s ease-in-out}
@keyframes cantilt{0%{opacity:0;transform:translate(-30px,-10px) rotate(0)}25%{opacity:1;transform:translate(0,0) rotate(0)}55%{opacity:1;transform:translate(10px,0) rotate(-28deg)}100%{opacity:0;transform:translate(10px,0) rotate(-28deg)}}
.pill2{background:#f3f8f4;border-radius:14px;padding:10px 4px;text-align:center}.pill2 b{display:block;font-size:17px}.pill2 span{font-size:10px;color:var(--mut);font-weight:700}
.mis{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #f1f4f1}.mis:last-child{border:0}
.mis .mi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none}
.tree-card{background:linear-gradient(120deg,#e8f8ff,var(--grbg));border-radius:18px;padding:12px;display:flex;align-items:center;gap:12px;cursor:pointer;border:1px solid #cfe8f2}
.tree-card .mini{font-size:40px;line-height:1}
@media(min-width:500px){body{height:min(100vh,900px);margin-top:max(0px,calc((100vh - 900px)/2));border-radius:34px;border:8px solid #111512}}
</style>
</head>
<body>
<div id="view"></div>
<nav id="tabs"></nav>
<div id="sheetbg" onclick="closeSheet()"></div>
<div id="sheet"></div>
<div id="pushb" onclick="pushGo()"></div>

<script>
/* ====================== DỮ LIỆU MẪU ====================== */
const fmt=n=>n===0?'Miễn phí':n.toLocaleString('vi-VN')+'đ';
const LAB={green:{n:'Xanh',sub:'Tươi mới · >5 ngày',pay:10,pick:120,free:30,cls:'green',ic:'ti-circle-check'},
           yellow:{n:'Vàng',sub:'Cận date · 3-5 ngày',pay:10,pick:90,free:20,cls:'yellow',ic:'ti-clock'},
           red:{n:'Đỏ',sub:'Cứu trợ khẩn cấp · <24h',pay:5,pick:60,free:15,cls:'red',ic:'ti-alert-triangle'}};
const STORES=[
 {id:'s1',name:'AEON Mall Long Biên',em:'🏬',dist:2.5,rate:4.9,addr:'27 Cổ Linh, Long Biên',hours:'09:00 – 22:00',phone:'024-3456-7890',kg:2.5,co2:1.8,meals:500},
 {id:'s2',name:'Circle K',em:'🏪',dist:1.1,rate:4.4,addr:'45 Lê Lợi, Q.1',hours:'06:00 – 23:00',phone:'028-3822-1111',kg:1.2,co2:.9,meals:210},
 {id:'s3',name:'Bách Hóa Xanh',em:'🛒',dist:.8,rate:4.8,addr:'12 Nguyễn Huệ, Q.1',hours:'07:00 – 22:00',phone:'028-3911-2233',kg:3.1,co2:2.2,meals:640},

function qr(seed){let h=0;for(const c of seed)h=(h*31+c.charCodeAt(0))>>>0;const N=25,r=()=>(h=(h*1103515245+12345)>>>0,(h>>16)&1);let s='';
 const fin=(x,y)=>x<8&&y<8||x>N-9&&y<8||x<8&&y>N-9;
 for(let y=0;y<N;y++)for(let x=0;x<N;x++){let on;if(fin(x,y)){const lx=x<8?x:x-(N-8),ly=y<8?y:y-(N-8);on=(lx===0||lx===6||ly===0||ly===6||(lx>=2&&lx<=4&&ly>=2&&ly<=4))&&lx<7&&ly<7}else on=r();if(on)s+=`<rect x="${x}" y="${y}" width="1" height="1"/>`}
 return `<svg viewBox="0 0 ${N} ${N}" fill="#111512" shape-rendering="crispEdges">${s}</svg>`}
